worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;
    server_tokens   off;

    # Апстрим бэкенда (имя сервиса в docker-сети)
    upstream backend {
        server backend:8000;
    }

    server {
        listen 80 default_server;
        server_name _;

        # --- Доступ только из локальной сети ---
        # Пускаем loopback и частные диапазоны (RFC 1918 + CGNAT),
        # всем остальным адресам отвечаем 403.
        allow 127.0.0.0/8;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 100.64.0.0/10;
        deny  all;

        root  /usr/share/nginx/html;
        index index.html;

        # SPA-роутинг: любой неизвестный путь отдаём index.html,
        # чтобы работал клиентский роутер (react-router).
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Проксирование REST API на бэкенд
        location /api/ {
            proxy_pass         http://backend;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # Кэшируем собранные ассеты Vite (имена с хэшами)
        location /assets/ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }
}
